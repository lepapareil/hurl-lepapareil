[package]
name = "hurlui_core"
version = "9.0.0"
authors = ["Fabrice Reix <fabrice.reix@orange.com>", "Jean-Christophe Amiel <jeanchristophe.amiel@orange.com>", "Filipe Pinto <filipe.pinto@orange.com>"]
edition = "2024"
license = "Apache-2.0"
description = "Hurl UI Core: Hurl file model, collections, environments and hurl binary runner"
documentation = "https://hurl.dev"
homepage = "https://hurl.dev"
repository = "https://github.com/Orange-OpenSource/hurl"
publish = false

[dependencies]
base64 = "0.23.1"
flate2 = "1.1.11"
notify = "8.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"

[dev-dependencies]
tiny_http = "0.12.0"

[lints]
workspace = true
